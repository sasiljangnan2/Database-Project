[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "train-reservation"
version = "0.2.0"
description = "기차 예약 및 승차권 관리 시스템 개발 시작 프로젝트"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
  "cryptography>=43",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1", "openapi-spec-validator>=0.7,<1", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/js/*.js", "static/samples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

