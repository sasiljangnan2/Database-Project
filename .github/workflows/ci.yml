name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: train_app_test
          MYSQL_USER: train_app
          MYSQL_PASSWORD: test_local_pw
          MYSQL_ROOT_PASSWORD: root_test_local_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_test_local_pw --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://train_app:test_local_pw@127.0.0.1:3306/train_app_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - name: Validate planned API contract
        run: python -m openapi_spec_validator docs/openapi.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend.test.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --profile web config --quiet
      - name: Build image with ignored environment files
        run: |
          printf 'BUILD_CONTEXT_SENTINEL=not-a-secret\n' > .env
          printf 'BUILD_CONTEXT_SENTINEL=not-a-secret\n' > app/.env
          docker build --tag train-reservation:ci .
      - name: Check runtime user and excluded files
        run: |
          docker run --rm --entrypoint python train-reservation:ci -c "import os; from pathlib import Path; assert os.getuid() == 10001; assert not list(Path('/app').rglob('.env*')); assert not Path('/app/.git').exists()"
      - name: Serve templates, API docs and static assets on PORT
        run: |
          docker run --detach --name train-web-ci \
            --publish 127.0.0.1:18080:8080 \
            --env PORT=8080 train-reservation:ci
          curl --fail --retry 20 --retry-connrefused --retry-all-errors \
            --retry-delay 1 --max-time 5 http://127.0.0.1:18080/api/v1/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/docs
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/static/js/api-client.js
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs train-web-ci || true
          docker rm --force train-web-ci || true

