{% extends "base.html" %}
{% block title %}화면 개발용 샘플{% endblock %}
{% block content %}
<p class="text-secondary">프론트엔드 개발용 · 가상 데이터</p>
<h1>API 연결 전 화면 미리보기</h1>
<p class="alert alert-warning">샘플 JSON을 표시합니다. 좌석 선택은 이 화면 안에서만 바뀌며 실제 예약·결제를 생성하지 않습니다.</p>
<p id="preview-error" class="text-danger" role="alert"></p>
<section class="card p-4 mb-4" aria-labelledby="run-title">
  <h2 id="run-title" class="h4">운행 검색 결과</h2>
  <div class="table-responsive">
    <table class="table"><thead><tr><th>편명</th><th>종류</th><th>출발</th><th>도착</th><th>운임</th></tr></thead>
      <tbody id="runs"></tbody>
    </table>
  </div>
</section>
<section class="card p-4 mb-4" aria-labelledby="seat-title">
  <h2 id="seat-title" class="h4">좌석 선택 컴포넌트</h2>
  <div id="seats" class="d-flex flex-wrap gap-2"></div>
  <p id="selection" class="mt-3 mb-0">선택한 좌석이 없습니다.</p>
</section>
<section class="card p-4" aria-labelledby="reservation-title">
  <h2 id="reservation-title" class="h4">예약 상세 응답 예시</h2>
  <pre id="reservation" class="mb-0"></pre>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/preview.js"></script>{% endblock %}
