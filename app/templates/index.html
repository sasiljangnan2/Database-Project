{% extends "base.html" %}
{% block title %}HRAIL | 기차 예약{% endblock %}
{% block styles %}
  <meta name="description" content="HRAIL 기차 예약 체험과 회원 서비스">
  <link rel="stylesheet" href="/static/hrail.css">
{% endblock %}

{% block body %}
  <a class="skip-link" href="#app">본문 바로가기</a>

  <header class="site-header">
    <div class="header-inner">
      <button
        type="button"
        class="brand"
        data-action="home"
        aria-label="HRAIL 홈"
      >
        <svg
          viewBox="0 0 44 34"
          width="38"
          height="32"
          aria-hidden="true"
        >
          <path
            d="M3 25C12 6 26 1 41 7L35 13C24 8 13 13 8 25Z"
            fill="currentColor"
          />
          <path
            d="M1 32C11 17 23 14 36 18L29 25C19 22 11 26 7 32Z"
            fill="currentColor"
          />
        </svg>
        <span>HRAIL</span>
      </button>

      <nav class="main-nav" aria-label="주요 메뉴">
        <button type="button" data-action="home">예매 체험</button>
        <button type="button" data-action="bookings">체험 내역</button>
        <button type="button" data-action="help">이용 안내</button>
      </nav>

      <div id="auth-nav" class="auth-nav"></div>
    </div>
  </header>

  <p class="demo-banner mb-0">예매 체험은 예시 열차와 좌석으로 진행하며 결제는 모의로 처리됩니다.</p>
  <main id="app" class="main-container" tabindex="-1">
    <noscript>예매 체험과 회원 서비스를 이용하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <strong>HRAIL</strong>
      <span>기차 예약 시스템</span>
      {% if preview_enabled %}<a href="/dev/preview">개발용 API 샘플</a>{% endif %}
    </div>
  </footer>

  <div
    id="toast"
    class="app-toast"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></div>
{% endblock %}
{% block scripts %}
  <script type="module" src="/static/js/hrail.js"></script>
{% endblock %}
