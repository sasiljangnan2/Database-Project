services:
  web:
    profiles: [web]
    build: .
    environment:
      APP_NAME: "${APP_NAME:-Train Reservation}"
      DATABASE_URL: "mysql+pymysql://train_app:train_local_pw@db:3306/train_app?charset=utf8mb4"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      ENABLE_FRONTEND_PREVIEW: "${ENABLE_FRONTEND_PREVIEW:-false}"
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: train_app
      MYSQL_USER: train_app
      MYSQL_PASSWORD: train_local_pw
      MYSQL_ROOT_PASSWORD: root_local_pw
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - train_db:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  train_db:

