services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: train_app
      MYSQL_USER: train_app
      MYSQL_PASSWORD: train_local_pw
      MYSQL_ROOT_PASSWORD: root_local_pw
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - train_db:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  train_db:

